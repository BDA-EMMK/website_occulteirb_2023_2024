<script>

/* Hover effect, for the team member */
function changeInfo(member, name, course, new_img, new_name, new_cursus) {
  // To change the image and the name
    member.querySelector('img').src = new_img;
    member.querySelector('#' + name).innerHTML = new_name;
    member.querySelector('#' + course).innerHTML = new_cursus;
}

function resetInfo(member, name, course, current_img, current_name, current_cursus) {
  // To reset
    member.querySelector('img').src = current_img;
    member.querySelector('#' + name).innerHTML = current_name;
    member.querySelector('#' + course).innerHTML = current_cursus;
}

</script>
