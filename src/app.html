<style>
@keyframes loading-dot-animation {
	from {
		opacity: 0;
		/* translate: 0 -10%; */
		translate: -1rem 0;
	}
	50% {
		opacity: 1;
		translate: 0 0;
	}
	to {
		opacity: 0;
		/* translate: 0 10%; */
		translate: 1rem 0;
	}
}

.loading {
  position: fixed;
  width: 100vw;
  height: 100vh;

	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;

  z-index: 2000;

  background-color: #D09125;
	color: #1A1027;

	will-change: opacity;
	opacity: 1;
  transition: opacity ease-in-out 2s 1.5s;
}

.loading p {
	position: absolute;

	font-size: 6rem;
	letter-spacing: 1rem;

	transition: opacity 1s ease-in-out .5s, transform 1s ease-in-out .5s;
}

.loaded-text {
	opacity: 0;
	transform: translateY(-100%);
}

.loading-text {
	opacity: 1;
	transform: translateY(0);
}

.loading-dot {
	display: inline-block;
	padding-left: 2rem;
}

.loading-dot_1 {
	animation: 2s ease-in-out loading-dot-animation infinite;
}

.loading-dot_2 {
	animation: 2s ease-in-out .5s loading-dot-animation infinite;
}

.loading-dot_3 {
	animation: 2s ease-in-out 1s loading-dot-animation infinite;
}

.loading.loaded .loaded-text {
	opacity: 1;
	transform: translateY(0);
}

.loading.loaded .loading-text {
	opacity: 0;
	transform: translateY(100%);
}

.loading.loaded {
	opacity: 0; 
	pointer-events: none;  /* Do not prevent from click nav ... */
}

@media screen and (max-width: 899px) {
.loading p {
	font-size: 5rem;
	letter-spacing: .3rem;
}
}
</style>
<div class="loading" id="loading-screen">
	<p class="loaded-text">Loaded !</p>
	<p class="loading-text">Loading<span class="loading-dot loading-dot_1">.</span><span class="loading-dot loading-dot_2">.</span><span class="loading-dot loading-dot_3">.</span></p>
</div>

		<div style="display: contents">%sveltekit.body%</div>

<script>
const loadingScreen = document.getElementById("loading-screen");

// Hide loading screen
if (document.readyState === 'complete')
	loadingScreen.classList.add("loaded");

window.addEventListener("load", (_) => {
	loadingScreen.classList.add("loaded");
});
</script>
